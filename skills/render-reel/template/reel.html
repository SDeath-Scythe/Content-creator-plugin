<!doctype html>
<!-- Arabic reel template (right to left). For English, see reel-en.html. Digits and currency as set in creator/page.md.
     Replace the sample scenes with the script from plan.md: one .scene per beat, timed with data-start/data-end.
     Keep text inside .safe. The hook scene must move from frame 0 and land its claim at about 1.2 to 1.6 s. -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="reel-duration" content="20">
  <meta name="reel-fps" content="30">
  <title>reel</title>
  <!-- reel.css, reel.js and fonts/ come from the plugin when they aren't next to this file -->
  <link rel="stylesheet" href="reel.css">
  <style>
    /* The page's look, from creator/page.md */
    :root { --bg: #0B1F3A; --fg: #FFFFFF; --accent: #FFC93C; }
  </style>
</head>
<body>
  <div class="stage">

    <!-- Background motion under every scene -->
    <div class="blob drift" data-start="0"></div>

    <!-- 0 to 3 s: the hook. Moving from frame 0; the claim lands word by word from 1.2 s. -->
    <section class="scene" data-start="0" data-end="3">
      <div class="safe">
        <div class="num slam">3</div>
        <p class="hook words" style="--from: 1.2s">أخطاء تخليك تسعّر أقل من قيمتك</p>
      </div>
    </section>

    <section class="scene" data-start="3" data-end="8">
      <div class="safe">
        <p class="big rise"><span class="accent">1.</span> تسعّر بالساعة</p>
        <p class="body rise muted" style="animation-delay: .4s">العميل يدفع على النتيجة، مو على وقتك</p>
      </div>
    </section>

    <section class="scene" data-start="8" data-end="13">
      <div class="safe">
        <p class="big rise"><span class="accent">2.</span> ما عندك باقات</p>
        <p class="body rise muted" style="animation-delay: .4s">ثلاث باقات تخلي القرار أسهل عليه</p>
      </div>
    </section>

    <section class="scene" data-start="13" data-end="17">
      <div class="safe">
        <p class="big rise"><span class="accent">3.</span> تعطي السعر قبل ما تفهم المشروع</p>
      </div>
    </section>

    <!-- CTA: serves the page goal in creator/page.md -->
    <section class="scene" data-start="17" data-end="20">
      <div class="safe">
        <p class="big pop">اكتب <span class="accent">سعر</span> في التعليقات</p>
        <p class="body rise muted" style="animation-delay: .35s">وأرسل لك حاسبة التسعير مجاناً</p>
      </div>
    </section>

    <div id="captions"></div>

    <!-- Cover (?mode=cover): the hook in a few words, inside the 3:4 grid crop -->
    <section class="cover">
      <div class="safe">
        <div class="num">3</div>
        <p class="hook">أخطاء تخليك تسعّر أقل من قيمتك</p>
      </div>
    </section>

    <div class="guide"></div>
  </div>

  <!-- Captions timed to the voiceover. Get timings from a transcript of the recorded voice. -->
  <script type="application/json" id="captions-data">[]</script>
  <script src="reel.js"></script>
</body>
</html>
